<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink"
  viewBox="0 0 100 100" width="100" height="100"
  version="1.2" baseProfile="tiny-ps">
  <title>The Daily Rot</title>
  <!-- Background circle -->
  <circle cx="50" cy="50" r="50" fill="#0a0a0a"/>
  <!-- Green outer ring -->
  <circle cx="50" cy="50" r="48" fill="none" stroke="#39ff14" stroke-width="2"/>
  <!-- Skull head -->
  <ellipse cx="50" cy="44" rx="20" ry="19" fill="#39ff14"/>
  <!-- Skull jaw -->
  <rect x="36" y="56" width="28" height="10" rx="3" fill="#39ff14"/>
  <!-- Skull teeth gaps -->
  <rect x="41" y="59" width="4" height="7" rx="1" fill="#0a0a0a"/>
  <rect x="48" y="59" width="4" height="7" rx="1" fill="#0a0a0a"/>
  <rect x="55" y="59" width="4" height="7" rx="1" fill="#0a0a0a"/>
  <!-- Eye sockets -->
  <ellipse cx="43" cy="42" rx="6" ry="6" fill="#0a0a0a"/>
  <ellipse cx="57" cy="42" rx="6" ry="6" fill="#0a0a0a"/>
  <!-- Nose -->
  <ellipse cx="50" cy="51" rx="3" ry="2.5" fill="#0a0a0a"/>
  <!-- DR text -->
  <text x="50" y="85" font-family="Arial Black, sans-serif" font-size="10" font-weight="900"
    text-anchor="middle" fill="#39ff14" letter-spacing="2">DR</text>
</svg>
